<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopXpress - Online Store</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background: #f4f4f9; }
    h1 { text-align: center; color: #333; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 20px; }
    .card { background: white; border-radius: 8px; padding: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
    .card img { width: 100%; height: 140px; object-fit: cover; border-radius: 6px; }
    .card h3 { margin: 8px 0 4px; font-size: 16px; }
    .card p { color: #27ae60; font-weight: bold; margin: 0 0 8px; }
    .btn { background: #27ae60; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; width: 100%; }
    .modal { display: none; position: fixed; top: 0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; }
    .modal-content { background:white; padding:20px; border-radius:8px; width:90%; max-width:350px; }
    .modal-content input { width:90%; padding:8px; margin:8px 0; }
  </style>
</head>
<body>

  <h1>ShopXpress</h1>
  <div id="productsGrid" class="grid"><p>Products loading...</p></div>

  <!-- Order Modal -->
  <div id="orderModal" class="modal">
    <div class="modal-content">
      <h3>Order Place Karein</h3>
      <p id="modalProductName"></p>
      <input type="text" id="custName" placeholder="Aapka Naam">
      <input type="text" id="custPhone" placeholder="Mobile Number">
      <input type="text" id="custAddress" placeholder="Pura Pata (Address)">
      <button class="btn" onclick="submitOrder()">Confirm Order</button>
      <button class="btn" style="background:#e74c3c; margin-top:5px;" onclick="closeModal()">Cancel</button>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD5X70q8Ty99qnkk659HjfWNuFl2zLtD-8",
      authDomain: "shopxpress-11644.firebaseapp.com",
      projectId: "shopxpress-11644",
      storageBucket: "shopxpress-11644.firebasestorage.app",
      messagingSenderId: "641687826829",
      appId: "1:641687826829:web:eca5e50d38c5d7faa88dc4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let selectedProduct = "";

    async function loadProducts() {
      const querySnapshot = await getDocs(collection(db, "products"));
      const grid = document.getElementById("productsGrid");
      grid.innerHTML = "";
      querySnapshot.forEach((doc) => {
        const p = doc.data();
        grid.innerHTML += `
          <div class="card">
            <img src="${p.image || 'https://via.placeholder.com/150'}" alt="${p.title}">
            <h3>${p.title}</h3>
            <p>Rs. ${p.price}</p>
            <button class="btn" onclick="openOrderModal('${p.title}')">Order Karein</button>
          </div>
        `;
      });
    }

    window.openOrderModal = (title) => {
      selectedProduct = title;
      document.getElementById("modalProductName").innerText = "Product: " + title;
      document.getElementById("orderModal").style.display = "flex";
    };

    window.closeModal = () => {
      document.getElementById("orderModal").style.display = "none";
    };

    window.submitOrder = async () => {
      const name = document.getElementById("custName").value;
      const phone = document.getElementById("custPhone").value;
      const address = document.getElementById("custAddress").value;

      if(!name || !phone || !address) return alert("Tamam details bharein!");

      await addDoc(collection(db, "orders"), {
        product: selectedProduct,
        customerName: name,
        phone: phone,
        address: address,
        status: "Pending",
        date: new Date().toLocaleString()
      });

      alert("Aapka order receive ho gaya hai!");
      closeModal();
    };

    loadProducts();
  </script>
</body>
</html>
