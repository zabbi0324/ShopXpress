<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Challan - Admin Panel</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .admin-header {
            background: #004b8d;
            color: white;
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-card {
            background: white;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .admin-card h3 {
            margin-bottom: 15px;
            color: #004b8d;
            font-size: 18px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 8px;
        }

        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #555;
            margin-bottom: 5px;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        .form-input:focus {
            border-color: #004b8d;
        }

        .admin-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        .admin-btn:hover {
            background-color: #218838;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            margin-top: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            text-align: left;
            min-width: 700px;
        }

        th {
            background-color: #004b8d;
            color: white;
            padding: 10px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        .btn-delete {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-delete:hover {
            background-color: #c82333;
        }

        .badge {
            padding: 3px 6px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: bold;
        }
        .badge-yes { background-color: #d4edda; color: #155724; }
        .badge-no { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="admin-header">
            <h2>⚙️ E-Challan Admin Dashboard</h2>
            <span id="recordCount" style="background: rgba(255,255,255,0.2); padding: 5px 10px; border-radius: 4px; font-size: 13px;">Total Records: 0</span>
        </div>

        <!-- Add New Challan Form -->
        <div class="admin-card">
            <h3>➕ Add New Challan Entry</h3>
            <div class="admin-grid">
                <div class="form-group">
                    <label class="form-label">Challan No</label>
                    <input type="text" id="admChallanNo" class="form-input" placeholder="e.g. 28818599">
                </div>
                <div class="form-group">
                    <label class="form-label">Plate Number</label>
                    <input type="text" id="admPlate" class="form-input" placeholder="e.g. ABC-1234">
                </div>
                <div class="form-group">
                    <label class="form-label">CNIC Number</label>
                    <input type="text" id="admCnic" class="form-input" placeholder="e.g. 3520212345671">
                </div>
                <div class="form-group">
                    <label class="form-label">Penalty Amount (Rs)</label>
                    <input type="number" id="admAmount" class="form-input" value="2000">
                </div>
                <div class="form-group">
                    <label class="form-label">Due Date</label>
                    <input type="date" id="admDate" class="form-input">
                </div>
                <div class="form-group">
                    <label class="form-label">Offense Type</label>
                    <input type="text" id="admOffense" class="form-input" placeholder="e.g. Riding Without Helmet">
                </div>
                <div class="form-group">
                    <label class="form-label">Paid Status</label>
                    <select id="admStatus" class="form-input">
                        <option value="No">Unpaid (No)</option>
                        <option value="Yes">Paid (Yes)</option>
                    </select>
                </div>
            </div>
            <button class="admin-btn" onclick="addNewChallan()">Save Challan Record</button>
        </div>

        <!-- Database Records List -->
        <div class="admin-card">
            <h3>📋 Existing Database Records</h3>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Challan No</th>
                            <th>Plate No</th>
                            <th>CNIC</th>
                            <th>Amount</th>
                            <th>Due Date</th>
                            <th>Offense</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                        <!-- Dynamic Rows -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Default Sample Data if LocalStorage is empty
        const defaultData = [
            { challanNo: '28818522', plate: 'ABC-1234', cnic: '3520212345671', amount: '2000', date: '2026-09-27', offense: 'Riding Without Helmet', paid: 'Yes' },
            { challanNo: '27090791', plate: 'ABC-1234', cnic: '3520212345671', amount: '2000', date: '2026-08-23', offense: 'Signal Disobey', paid: 'No' }
        ];

        function getChallans() {
            const data = localStorage.getItem('psca_challans');
            return data ? JSON.parse(data) : defaultData;
        }

        function saveChallans(data) {
            localStorage.setItem('psca_challans', JSON.stringify(data));
        }

        if (!localStorage.getItem('psca_challans')) {
            saveChallans(defaultData);
        }

        // Render Table Data
        function renderAdminTable() {
            const currentData = getChallans();
            document.getElementById('recordCount').innerText = `Total Records: ${currentData.length}`;
            const adminBody = document.getElementById('adminTableBody');
            adminBody.innerHTML = '';

            if (currentData.length === 0) {
                adminBody.innerHTML = `<tr><td colspan="8" style="text-align:center; color:#777; padding: 20px;">کوئی ریکارڈ موجود نہیں ہے</td></tr>`;
                return;
            }

            currentData.forEach((item, index) => {
                const statusBadge = item.paid === 'Yes' ? '<span class="badge badge-yes">Yes</span>' : '<span class="badge badge-no">No</span>';
                adminBody.innerHTML += `
                    <tr>
                        <td>${item.challanNo}</td>
                        <td><strong>${item.plate}</strong></td>
                        <td>${item.cnic}</td>
                        <td>Rs. ${item.amount}</td>
                        <td>${item.date}</td>
                        <td>${item.offense}</td>
                        <td>${statusBadge}</td>
                        <td>
                            <button class="btn-delete" onclick="deleteChallan(${index})">Delete</button>
                        </td>
                    </tr>
                `;
            });
        }

        // Add New Challan
        function addNewChallan() {
            const challanNo = document.getElementById('admChallanNo').value.trim();
            const plate = document.getElementById('admPlate').value.trim().toUpperCase();
            const cnic = document.getElementById('admCnic').value.trim();
            const amount = document.getElementById('admAmount').value.trim();
            const date = document.getElementById('admDate').value;
            const offense = document.getElementById('admOffense').value.trim() || 'Traffic Violation';
            const paid = document.getElementById('admStatus').value;

            if (!challanNo || !plate || !cnic) {
                alert("براہ کرم Challan No, Plate Number اور CNIC لازمی درج کریں!");
                return;
            }

            const currentData = getChallans();
            currentData.push({ challanNo, plate, cnic, amount, date, offense, paid });
            saveChallans(currentData);

            alert("نیا چالان کامیابی سے محفوظ ہو گیا ہے!");
            
            // Clear inputs
            document.getElementById('admChallanNo').value = '';
            document.getElementById('admPlate').value = '';
            document.getElementById('admCnic').value = '';
            document.getElementById('admOffense').value = '';

            renderAdminTable();
        }

        // Delete Record
        function deleteChallan(index) {
            if (confirm("کیا آپ واقعی اس ریکارڈ کو ڈیلیٹ کرنا چاہتے ہیں؟")) {
                const currentData = getChallans();
                currentData.splice(index, 1);
                saveChallans(currentData);
                renderAdminTable();
            }
        }

        // Initial Load
        window.onload = function() {
            renderAdminTable();
            // Set today's date by default in date input
            document.getElementById('admDate').valueAsDate = new Date();
        };
    </script>
</body>
</html>
