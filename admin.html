<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Flex - Standalone Admin Panel</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070a12;
            --card-bg: rgba(19, 27, 46, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #10b981;
            --primary-glow: rgba(16, 185, 129, 0.3);
            --accent: #3b82f6;
            --danger: #f43f5e;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 480px; background-color: #0b1120; min-height: 100vh; border-left: 1px solid var(--card-border); border-right: 1px solid var(--card-border); position: relative; }

        .auth-container { padding: 40px 24px; display: flex; flex-direction: column; justify-content: center; min-height: 100vh; background: radial-gradient(circle at top, rgba(245, 158, 11, 0.15), transparent 70%); }
        .auth-brand { text-align: center; margin-bottom: 32px; }
        .auth-brand .logo-icon { width: 70px; height: 70px; background: linear-gradient(135deg, var(--warning), #d97706); border-radius: 20px; display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; color: #000; margin-bottom: 16px; }

        header { padding: 16px 20px; background: rgba(11, 17, 32, 0.85); backdrop-filter: blur(16px); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--card-border); position: sticky; top: 0; z-index: 100; }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand i { color: var(--primary); font-size: 1.5rem; }
        .admin-badge-head { background: rgba(245, 158, 11, 0.2); color: var(--warning); border: 1px solid rgba(245, 158, 11, 0.4); padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 800; }

        .ticker-bar { background: #070a12; padding: 8px 16px; font-size: 0.75rem; display: flex; justify-content: space-between; border-bottom: 1px solid var(--card-border); color: var(--text-muted); }
        main { padding: 20px; }

        .admin-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .admin-stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
        .admin-stat-item { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px 8px; text-align: center; }
        .admin-stat-item h4 { font-size: 1.1rem; color: var(--primary); font-weight: 800; }
        .admin-stat-item p { font-size: 0.68rem; color: var(--text-muted); }

        .form-group { margin-bottom: 16px; }
        .form-control { width: 100%; padding: 14px; background-color: rgba(255, 255, 255, 0.03); border: 1px solid var(--card-border); border-radius: 12px; color: var(--text-main); font-size: 0.95rem; outline: none; }
        .btn { padding: 13px 16px; border: none; border-radius: 14px; font-weight: 700; font-size: 0.88rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background-color: var(--primary); color: #fff; }
        .btn-danger { background-color: rgba(244, 63, 94, 0.15); color: var(--danger); border: 1px solid rgba(244, 63, 94, 0.3); }
        .btn-warning { background-color: var(--warning); color: #000; }
        .btn-secondary { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border); color: var(--text-muted); }
        .btn-sm { padding: 6px 12px; font-size: 0.75rem; border-radius: 8px; }

        .section-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
        .status-badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 6px; font-weight: 700; text-transform: uppercase; }
        .status-blocked { background: rgba(244, 63, 94, 0.2); color: var(--danger); border: 1px solid var(--danger); }
        .status-active { background: rgba(16, 185, 129, 0.2); color: var(--primary); border: 1px solid var(--primary); }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Auth Screen -->
        <div id="auth-screen" class="auth-container">
            <div class="auth-brand">
                <div class="logo-icon"><i class="fa-solid fa-user-shield"></i></div>
                <h2>Admin Control Center</h2>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;">Trade Flex Live Database</p>
            </div>
            <form id="admin-login-form" onsubmit="handleAdminLogin(event)">
                <div class="form-group">
                    <input type="password" id="admin-pass-input" class="form-control" placeholder="Enter Admin Password" required>
                </div>
                <button type="submit" class="btn btn-warning" style="width: 100%;">Log In</button>
            </form>
        </div>

        <!-- Main Admin App -->
        <div id="main-admin-app" style="display: none;">
            <header>
                <div class="brand">
                    <i class="fa-solid fa-chart-line"></i>
                    <h1>Trade Flex</h1>
                </div>
                <div class="admin-badge-head">ADMIN</div>
            </header>

            <div class="ticker-bar">
                <span><i class="fa-solid fa-shield-halved" style="color: var(--warning);"></i> Live Sync Active</span>
                <span style="color: var(--primary);"><i class="fa-solid fa-database"></i> Firebase Connected</span>
            </div>

            <main>
                <div class="section-title" style="color: var(--warning);">
                    <span><i class="fa-solid fa-shield-halved"></i> Master Admin Control</span>
                </div>

                <div class="admin-stat-grid">
                    <div class="admin-stat-item">
                        <h4 id="admin-total-users">0</h4>
                        <p>Total Users</p>
                    </div>
                    <div class="admin-stat-item">
                        <h4 id="admin-pending-req">0</h4>
                        <p>Pending Requests</p>
                    </div>
                    <div class="admin-stat-item">
                        <h4 id="admin-total-balance">PKR 0</h4>
                        <p>System Balance</p>
                    </div>
                </div>

                <div class="section-title">Pending Approvals</div>
                <div id="admin-pending-container">Loading...</div>

                <div class="section-title" style="margin-top:20px;">Users Database</div>
                <div id="admin-users-container">Loading...</div>
            </main>
        </div>
    </div>

    <!-- Firebase SDK Modular Import -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD5X70q8Ty99qnkk659HjfWNuFl2zLtD-8",
            authDomain: "shopxpress-11644.firebaseapp.com",
            databaseURL: "https://shopxpress-11644-default-rtdb.firebaseio.com",
            projectId: "shopxpress-11644",
            storageBucket: "shopxpress-11644.firebasestorage.app",
            messagingSenderId: "641687826829",
            appId: "1:641687826829:web:eca5e50d38c5d7faa88dc4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let usersData = {};
        let allPendingRequests = [];

        window.handleAdminLogin = function(e) {
            e.preventDefault();
            const pass = document.getElementById('admin-pass-input').value;
            if (pass === 'admin123') {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('main-admin-app').style.display = 'block';
                listenToFirebaseData();
            } else {
                alert('Wrong Password!');
            }
        }

        function listenToFirebaseData() {
            // 1. Listen Users
            onValue(ref(db, 'users'), (snapshot) => {
                usersData = snapshot.val() || {};
                renderDashboard();
            });

            // 2. Listen all possible nodes for pending requests
            const reqNodes = ['transactions', 'requests', 'deposits', 'withdrawals'];
            reqNodes.forEach(node => {
                onValue(ref(db, node), () => {
                    fetchAllRequests();
                });
            });
        }

        function fetchAllRequests() {
            const reqNodes = ['transactions', 'requests', 'deposits', 'withdrawals'];
            let fetched = [];

            reqNodes.forEach(node => {
                onValue(ref(db, node), (snapshot) => {
                    const data = snapshot.val() || {};
                    Object.keys(data).forEach(id => {
                        let item = data[id];
                        let status = (item.status || '').toLowerCase();
                        if (!item.status || status === 'pending') {
                            fetched.push({
                                id: id,
                                nodePath: node,
                                type: item.type || (node === 'withdrawals' ? 'Withdrawal' : 'Deposit'),
                                amount: item.amount || 0,
                                userPhone: item.userPhone || item.phone || item.userId || 'N/A',
                                txid: item.txid || item.trxId || item.transactionId || 'N/A',
                                rawData: item
                            });
                        }
                    });
                    
                    let uniqueMap = {};
                    fetched.forEach(f => uniqueMap[f.id] = f);
                    allPendingRequests = Object.values(uniqueMap);
                    
                    renderDashboard();
                }, { onlyOnce: true });
            });
        }

        function renderDashboard() {
            const userKeys = Object.keys(usersData);

            let totalBal = 0;
            userKeys.forEach(k => {
                totalBal += parseFloat(usersData[k].balance || 0);
            });

            document.getElementById('admin-total-users').innerText = userKeys.length;
            document.getElementById('admin-pending-req').innerText = allPendingRequests.length;
            document.getElementById('admin-total-balance').innerText = 'PKR ' + totalBal.toFixed(0);

            // Render Pending Approvals
            const pendingContainer = document.getElementById('admin-pending-container');
            if (allPendingRequests.length === 0) {
                pendingContainer.innerHTML = '<p style="color:var(--text-muted); font-size:0.8rem; text-align:center;">No pending requests.</p>';
            } else {
                let html = '';
                allPendingRequests.forEach(req => {
                    html += `
                        <div class="admin-card">
                            <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
                                <strong style="text-transform:capitalize;">${req.type}</strong>
                                <span style="color:var(--primary);">PKR ${req.amount}</span>
                            </div>
                            <p style="font-size:0.75rem; color:var(--text-muted);">User: ${req.userPhone}</p>
                            <p style="font-size:0.75rem; color:var(--text-muted); margin-bottom:8px;">Ref/TID: ${req.txid}</p>
                            <div style="display:flex; gap:8px;">
                                <button class="btn btn-primary btn-sm" style="flex:1;" onclick="processTx('${req.nodePath}', '${req.id}', 'approved', '${req.userPhone}', ${req.amount}, '${req.type}')">Approve</button>
                                <button class="btn btn-danger btn-sm" style="flex:1; background:var(--danger); color:white;" onclick="processTx('${req.nodePath}', '${req.id}', 'rejected', '${req.userPhone}', ${req.amount}, '${req.type}')">Reject</button>
                            </div>
                        </div>
                    `;
                });
                pendingContainer.innerHTML = html;
            }

            // Render Users
            const usersContainer = document.getElementById('admin-users-container');
            let uHtml = '';
            userKeys.forEach(p => {
                const u = usersData[p];
                const isBlocked = u.isBlocked === true || u.status === 'blocked';
                
                uHtml += `
                    <div class="admin-card">
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                            <div>
                                <strong>${u.username || u.name || 'User'}</strong>
                                <span class="status-badge ${isBlocked ? 'status-blocked' : 'status-active'}" style="margin-left:6px;">
                                    ${isBlocked ? 'Blocked' : 'Active'}
                                </span>
                            </div>
                            <span style="color:var(--primary);">PKR ${u.balance || 0}</span>
                        </div>
                        <p style="font-size:0.75rem; color:var(--text-muted);">Key/Phone: ${p}</p>
                        <div style="display:flex; gap:6px; margin-top:10px;">
                            <button class="btn btn-secondary btn-sm" style="flex:1;" onclick="editUserBalance('${p}', ${u.balance || 0})">Edit Balance</button>
                            ${isBlocked 
                                ? `<button class="btn btn-primary btn-sm" style="flex:1;" onclick="toggleBlockUser('${p}', false)">Unblock</button>` 
                                : `<button class="btn btn-danger btn-sm" style="flex:1; background:var(--danger); color:white;" onclick="toggleBlockUser('${p}', true)">Block</button>`
                            }
                        </div>
                    </div>
                `;
            });
            usersContainer.innerHTML = uHtml || '<p style="color:var(--text-muted); font-size:0.8rem;">No users found.</p>';
        }

        window.processTx = function(nodePath, txId, status, userPhone, amount, type) {
            const updates = {};
            
            updates[`${nodePath}/${txId}/status`] = status;

            if (status === 'approved') {
                let userKey = Object.keys(usersData).find(k => k === userPhone || usersData[k].phone === userPhone);
                if (userKey) {
                    let currentBal = parseFloat(usersData[userKey].balance || 0);
                    let amt = parseFloat(amount || 0);

                    if (type.toLowerCase().includes('withdraw')) {
                        updates[`users/${userKey}/balance`] = Math.max(0, currentBal - amt);
                    } else {
                        updates[`users/${userKey}/balance`] = currentBal + amt;
                    }
                }
            }

            update(ref(db), updates).then(() => {
                alert(`Request ${status} successfully!`);
                fetchAllRequests();
            }).catch(err => {
                alert('Error updating request: ' + err.message);
            });
        }

        window.editUserBalance = function(userKey, currentBal) {
            const newBal = prompt(`Enter new balance for ${userKey}:`, currentBal);
            if (newBal !== null && !isNaN(newBal) && newBal !== '') {
                const updates = {};
                updates[`users/${userKey}/balance`] = parseFloat(newBal);
                update(ref(db), updates).then(() => alert('Balance updated!'));
            }
        }

        window.toggleBlockUser = function(userKey, shouldBlock) {
            const action = shouldBlock ? 'block' : 'unblock';
            if (confirm(`Are you sure you want to ${action} this user (${userKey})?`)) {
                const updates = {};
                updates[`users/${userKey}/isBlocked`] = shouldBlock;
                updates[`users/${userKey}/status`] = shouldBlock ? 'blocked' : 'active';
                
                update(ref(db), updates).then(() => {
                    alert(`User ${shouldBlock ? 'Blocked' : 'Unblocked'} successfully!`);
                }).catch(err => {
                    alert('Error: ' + err.message);
                });
            }
        }
    </script>
</body>
</html>
