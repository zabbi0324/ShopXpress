<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopXpress Admin Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 15px; }
    h2 { text-align: center; color: #2c3e50; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; max-width: 500px; margin-left: auto; margin-right: auto; }
    .card h3 { margin-top: 0; color: #34495e; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
    button { background: #2980b9; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #1c5980; }
    .order-item { border-bottom: 1px solid #eee; padding: 10px 0; }
    .order-item:last-child { border-bottom: none; }
    .badge { padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .status-Pending { background: #f39c12; color: white; }
    .status-Approved { background: #27ae60; color: white; }
  </style>
</head>
<body>

  <h2>ShopXpress Admin Dashboard</h2>

  <div class="card">
    <h3>Naya Product Add Karein</h3>
    <input type="text" id="pTitle" placeholder="Product Ka Naam">
    <input type="number" id="pPrice" placeholder="Keemat (Rs)">
    
    <label style="display:block; margin-top:10px; font-weight:bold; color:#555;">Gallery Se Photo Select Karein:</label>
    <input type="file" id="pImageFile" accept="image/*">
    
    <button id="uploadBtn">Product Upload Karein</button>
  </div>

  <div class="card">
    <h3>Aaye Hue Orders</h3>
    <div id="ordersList">Loading orders...</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD5X70q8Ty99qnkk659HjfWNuFl2zLtD-8",
      authDomain: "shopxpress-11644.firebaseapp.com",
      projectId: "shopxpress-11644",
      storageBucket: "shopxpress-11644.firebasestorage.app",
      messagingSenderId: "641687826829",
      appId: "1:641687826829:web:eca5e50d38c5d7faa88dc4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const IMGBB_API_KEY = "2bc7164997e07ef87861748adbdb31bf";

    // Product Add function
    document.getElementById("uploadBtn").addEventListener("click", async () => {
      const title = document.getElementById("pTitle").value;
      const price = document.getElementById("pPrice").value;
      const fileInput = document.getElementById("pImageFile");
      const btn = document.getElementById("uploadBtn");

      if (!title || !price || fileInput.files.length === 0) {
        return alert("Tamam details aur gallery se photo zaroor select karein!");
      }

      btn.innerText = "Photo Upload Ho Rahi Hai...";
      btn.disabled = true;

      try {
        const formData = new FormData();
        formData.append("image", fileInput.files[0]);

        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: "POST",
          body: formData
        });

        const data = await res.json();

        if (data.success) {
          const imageUrl = data.data.url;

          await addDoc(collection(db, "products"), {
            title: title,
            price: Number(price),
            image: imageUrl,
            createdAt: new Date()
          });

          alert("Product kaamyaabi se upload ho gaya!");
          document.getElementById("pTitle").value = "";
          document.getElementById("pPrice").value = "";
          fileInput.value = "";
        } else {
          alert("Image upload fail ho gayi. Dobara try karein.");
        }
      } catch (err) {
        console.error(err);
        alert("Upload mein error aaya!");
      } finally {
        btn.innerText = "Product Upload Karein";
        btn.disabled = false;
      }
    });

    // Orders display
    async function loadOrders() {
      const querySnapshot = await getDocs(collection(db, "orders"));
      const list = document.getElementById("ordersList");
      list.innerHTML = "";

      if(querySnapshot.empty) {
        list.innerHTML = "<p>Abhi koi order nahi aaya.</p>";
        return;
      }

      querySnapshot.forEach((d) => {
        const o = d.data();
        const orderDiv = document.createElement("div");
        orderDiv.className = "order-item";
        orderDiv.innerHTML = `
          <p><strong>Item:</strong> ${o.product || 'N/A'}</p>
          <p><strong>Customer:</strong> ${o.customerName || 'N/A'} (${o.phone || ''})</p>
          <p><strong>Address:</strong> ${o.address || 'N/A'}</p>
          <p><strong>Status:</strong> <span class="badge status-${o.status}">${o.status}</span></p>
          ${o.status === 'Pending' ? `<button class="approve-btn" data-id="${d.id}">Approve Order</button>` : ''}
        `;
        list.appendChild(orderDiv);
      });

      // Attach click handlers to approve buttons
      document.querySelectorAll(".approve-btn").forEach(btn => {
        btn.addEventListener("click", async (e) => {
          const orderId = e.target.getAttribute("data-id");
          e.target.innerText = "Approving...";
          e.target.disabled = true;
          try {
            await updateDoc(doc(db, "orders", orderId), { status: "Approved" });
            alert("Order Approve ho gaya!");
            loadOrders();
          } catch (err) {
            console.error(err);
            alert("Error: " + err.message);
            e.target.innerText = "Approve Order";
            e.target.disabled = false;
          }
        });
      });
    }

    loadOrders();
  </script>
</body>
</html>
