<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Flex Pro - Admin Dashboard</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070a12;
            --card-bg: rgba(19, 27, 46, 0.85);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #10b981;
            --primary-glow: rgba(16, 185, 129, 0.3);
            --accent: #3b82f6;
            --danger: #f43f5e;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --radius: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .admin-container {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            padding-bottom: 50px;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            margin-bottom: 24px;
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-title i {
            font-size: 1.6rem;
            color: var(--primary);
        }

        .brand-title h2 {
            font-size: 1.3rem;
            font-weight: 800;
        }

        /* Stats Bar */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }

        .stat-info h3 {
            font-size: 1.2rem;
            font-weight: 800;
        }

        .stat-info p {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        /* Tabs Navigation */
        .admin-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 12px;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.88rem;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
            box-shadow: 0 4px 15px var(--primary-glow);
        }

        /* Data Tables / Cards */
        .request-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .request-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed var(--card-border);
            padding-bottom: 10px;
        }

        .user-details {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-details i {
            color: var(--accent);
            font-size: 1.2rem;
        }

        .request-body {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            font-size: 0.85rem;
        }

        .info-group label {
            color: var(--text-muted);
            display: block;
            font-size: 0.75rem;
            margin-bottom: 3px;
        }

        .info-group span {
            font-weight: 700;
            color: var(--text-main);
        }

        .screenshot-btn {
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .action-btns {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-approve {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 4px 12px var(--primary-glow);
        }

        .btn-reject {
            background: rgba(244, 63, 94, 0.15);
            color: var(--danger);
            border: 1px solid rgba(244, 63, 94, 0.3);
        }

        .badge {
            font-size: 0.72rem;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
        }

        .badge-pending { background: rgba(245, 158, 11, 0.15); color: var(--warning); }
        .badge-approved { background: rgba(16, 185, 129, 0.15); color: var(--primary); }
        .badge-rejected { background: rgba(244, 63, 94, 0.15); color: var(--danger); }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <!-- Header -->
        <header>
            <div class="brand-title">
                <i class="fa-solid fa-user-shield"></i>
                <h2>Admin Control Panel</h2>
            </div>
            <span class="badge badge-approved"><i class="fa-solid fa-circle" style="font-size: 0.5rem; vertical-align: middle;"></i> Live Server</span>
        </header>

        <!-- Stats Counter -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(245, 158, 11, 0.15); color: var(--warning);">
                    <i class="fa-solid fa-clock"></i>
                </div>
                <div class="stat-info">
                    <h3 id="stat-pending-dep">0</h3>
                    <p>Pending Deposits</p>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(59, 130, 246, 0.15); color: var(--accent);">
                    <i class="fa-solid fa-money-bill-transfer"></i>
                </div>
                <div class="stat-info">
                    <h3 id="stat-pending-with">0</h3>
                    <p>Pending Withdrawals</p>
                </div>
            </div>

            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(16, 185, 129, 0.15); color: var(--primary);">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
                <div class="stat-info">
                    <h3 id="stat-approved-total">0</h3>
                    <p>Approved Requests</p>
                </div>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="admin-tabs">
            <button class="tab-btn active" onclick="switchAdminTab('deposits')">
                <i class="fa-solid fa-wallet"></i> Deposit Requests
            </button>
            <button class="tab-btn" onclick="switchAdminTab('withdrawals')">
                <i class="fa-solid fa-money-bill-wave"></i> Withdrawal Requests
            </button>
        </div>

        <!-- View 1: Deposit Requests -->
        <div id="tab-deposits" class="admin-view">
            <div id="deposit-list"></div>
        </div>

        <!-- View 2: Withdrawal Requests -->
        <div id="tab-withdrawals" class="admin-view" style="display: none;">
            <div id="withdrawal-list"></div>
        </div>
    </div>

    <script>
        // Sample Real-Time Data Storage
        let deposits = [
            {
                id: 101,
                username: "Investor_92300",
                phone: "03001234567",
                method: "EasyPaisa",
                amount: 980,
                txid: "TRX88392019",
                date: "2026-09-27",
                screenshot: "#",
                status: "Pending"
            },
            {
                id: 102,
                username: "TraderPro_PK",
                phone: "03049876543",
                method: "JazzCash",
                amount: 3180,
                txid: "99120485102",
                date: "2026-09-27",
                screenshot: "#",
                status: "Pending"
            }
        ];

        let withdrawals = [
            {
                id: 201,
                username: "Investor_92300",
                phone: "03001234567",
                accountNum: "03001234567",
                accountTitle: "Muhammad Zohaib",
                method: "EasyPaisa",
                amount: 490,
                date: "2026-09-27",
                status: "Pending"
            }
        ];

        let approvedCount = 0;

        function renderAdminData() {
            renderDeposits();
            renderWithdrawals();
            updateStats();
        }

        function updateStats() {
            const pendingDep = deposits.filter(d => d.status === 'Pending').length;
            const pendingWith = withdrawals.filter(w => w.status === 'Pending').length;

            document.getElementById('stat-pending-dep').innerText = pendingDep;
            document.getElementById('stat-pending-with').innerText = pendingWith;
            document.getElementById('stat-approved-total').innerText = approvedCount;
        }

        function renderDeposits() {
            const container = document.getElementById('deposit-list');
            if (deposits.length === 0) {
                container.innerHTML = '<div class="empty-state">No deposit requests found.</div>';
                return;
            }

            let html = '';
            deposits.forEach(item => {
                const badgeClass = item.status === 'Approved' ? 'badge-approved' : (item.status === 'Rejected' ? 'badge-rejected' : 'badge-pending');
                
                html += `
                    <div class="request-card">
                        <div class="request-header">
                            <div class="user-details">
                                <i class="fa-solid fa-user-gear"></i>
                                <div>
                                    <strong style="font-size: 0.95rem;">${item.username}</strong>
                                    <div style="font-size:0.75rem; color:var(--text-muted);">${item.phone}</div>
                                </div>
                            </div>
                            <span class="badge ${badgeClass}">${item.status}</span>
                        </div>

                        <div class="request-body">
                            <div class="info-group">
                                <label>Amount & Method</label>
                                <span style="color:var(--primary); font-size:1rem;">PKR ${item.amount.toLocaleString()} (${item.method})</span>
                            </div>
                            <div class="info-group">
                                <label>Transaction ID (TID)</label>
                                <span>${item.txid}</span>
                            </div>
                            <div class="info-group">
                                <label>Submitted Date</label>
                                <span>${item.date}</span>
                            </div>
                            <div class="info-group">
                                <label>Payment Proof</label>
                                <a href="${item.screenshot}" target="_blank" class="screenshot-btn">
                                    <i class="fa-solid fa-image"></i> View Screenshot
                                </a>
                            </div>
                        </div>

                        ${item.status === 'Pending' ? `
                            <div class="action-btns">
                                <button class="btn btn-approve" onclick="approveDeposit(${item.id})">
                                    <i class="fa-solid fa-check"></i> Approve Deposit
                                </button>
                                <button class="btn btn-reject" onclick="rejectDeposit(${item.id})">
                                    <i class="fa-solid fa-xmark"></i> Reject
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function renderWithdrawals() {
            const container = document.getElementById('withdrawal-list');
            if (withdrawals.length === 0) {
                container.innerHTML = '<div class="empty-state">No withdrawal requests found.</div>';
                return;
            }

            let html = '';
            withdrawals.forEach(item => {
                const badgeClass = item.status === 'Approved' ? 'badge-approved' : (item.status === 'Rejected' ? 'badge-rejected' : 'badge-pending');

                html += `
                    <div class="request-card">
                        <div class="request-header">
                            <div class="user-details">
                                <i class="fa-solid fa-user"></i>
                                <div>
                                    <strong style="font-size: 0.95rem;">${item.username}</strong>
                                    <div style="font-size:0.75rem; color:var(--text-muted);">${item.phone}</div>
                                </div>
                            </div>
                            <span class="badge ${badgeClass}">${item.status}</span>
                        </div>

                        <div class="request-body">
                            <div class="info-group">
                                <label>Withdraw Amount</label>
                                <span style="color:var(--danger); font-size:1rem;">PKR ${item.amount.toLocaleString()}</span>
                            </div>
                            <div class="info-group">
                                <label>Method & Account</label>
                                <span>${item.method} - ${item.accountNum}</span>
                            </div>
                            <div class="info-group">
                                <label>Account Title</label>
                                <span>${item.accountTitle}</span>
                            </div>
                            <div class="info-group">
                                <label>Date</label>
                                <span>${item.date}</span>
                            </div>
                        </div>

                        ${item.status === 'Pending' ? `
                            <div class="action-btns">
                                <button class="btn btn-approve" onclick="approveWithdrawal(${item.id})">
                                    <i class="fa-solid fa-check"></i> Approve & Send Money
                                </button>
                                <button class="btn btn-reject" onclick="rejectWithdrawal(${item.id})">
                                    <i class="fa-solid fa-xmark"></i> Reject
                                </button>
                            </div>
                        ` : ''}
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        /* Admin Action Handlers */
        function approveDeposit(id) {
            const dep = deposits.find(d => d.id === id);
            if (dep) {
                dep.status = 'Approved';
                approvedCount++;
                renderAdminData();
                alert(`Deposit of PKR ${dep.amount} Approved for ${dep.username}! Balance updated.`);
            }
        }

        function rejectDeposit(id) {
            const dep = deposits.find(d => d.id === id);
            if (dep) {
                dep.status = 'Rejected';
                renderAdminData();
                alert(`Deposit request for ${dep.username} HAS BEEN REJECTED.`);
            }
        }

        function approveWithdrawal(id) {
            const withReq = withdrawals.find(w => w.id === id);
            if (withReq) {
                withReq.status = 'Approved';
                approvedCount++;
                renderAdminData();
                alert(`Withdrawal of PKR ${withReq.amount} Approved for ${withReq.accountTitle}!`);
            }
        }

        function rejectWithdrawal(id) {
            const withReq = withdrawals.find(w => w.id === id);
            if (withReq) {
                withReq.status = 'Rejected';
                renderAdminData();
                alert(`Withdrawal request HAS BEEN REJECTED. Balance refunded to user.`);
            }
        }

        function switchAdminTab(type) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.admin-view').forEach(view => view.style.display = 'none');

            if (type === 'deposits') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-deposits').style.display = 'block';
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-withdrawals').style.display = 'block';
            }
        }

        // Initial Load
        renderAdminData();
    </script>
</body>
</html>
